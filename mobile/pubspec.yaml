name: dualis_mobile
description: DualisCheckUp Mobile Preventive Health Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Reactive State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0

  # Navigation & Routing
  go_router: ^18.0.1

  # Networking & HTTP
  dio: ^5.11.1

  # Hardware Security & Biometrics
  local_auth: ^3.0.0
  flutter_secure_storage: ^11.1.1

  # UI, Typography & Visuals
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0

  # Device & Telephony Intents
  url_launcher: ^6.3.2

  # Media Picker (Gallery & Camera)
  image_picker: ^1.1.2

  # Offline Storage & Outbox Sync (Drift SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1

  # Local Notifications & Alarms for Hydration Reminders
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  build_runner: ^2.4.0
  freezed: ^4.0.1
  riverpod_generator: ^4.0.0
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/assets/
    - lib/assets/brand/
    - lib/assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "lib/assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0E3E6C"
  windows:
    generate: true
    image_path: "lib/assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "lib/assets/icon/app_icon.png"
