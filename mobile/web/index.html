  <style>
    body {
      margin: 0;

      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      transition: opacity 0.4s ease-out;
    }
    .loading-pulse-ring {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(0, 168, 150, 0.2);
      border-top-color: #00A896;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #FFFFFF;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #90A4AE;
      max-width: 280px;
      line-height: 1.4;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

<body>
  <div id="app-loading">
    <div class="loading-pulse-ring" aria-label="Carregando DualisCheckUp"></div>
    <div class="brand-title">DualisCheckUp</div>
    <div class="brand-subtitle">Iniciando ambiente seguro de triagem e saúde preventiva...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
