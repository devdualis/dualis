name: Mobile - Build Android APK

# PR validation lives in mobile-ci.yml; this workflow only builds from main/releases.
on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      split_per_abi:
        description: 'Split APKs per ABI (armeabi-v7a, arm64-v8a, x86_64)'
        required: false
        default: false
        type: boolean
      api_base_url:
        description: 'Backend API Base URL (e.g., https://dualis-backend-xyz.a.run.app)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  test:
    name: CI
    uses: ./.github/workflows/mobile-ci.yml

  build-apk:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    # `secrets` is not available in step-level `if`, so expose presence flags via env
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Set up Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ------------------------------------------------------------------------
      # Android Release Signing Setup
      # If repository secrets exist, decodes keystore and writes key.properties.
      # Otherwise, android/app/build.gradle.kts falls back gracefully to debug keys.
      # ------------------------------------------------------------------------
      - name: Configure Android Signing Keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Decoding release keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/release.keystore
          EOF
          echo "Android release keystore configured successfully."

      # ------------------------------------------------------------------------
      # Build APK with Environment Defines (API_BASE_URL)
      # ------------------------------------------------------------------------
      - name: Build Android APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          SPLIT_ABI: ${{ inputs.split_per_abi || false }}
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL }}
          DART_DEFINES_JSON: ${{ secrets.MOBILE_DART_DEFINES_JSON }}
        run: |
          BUILD_ARGS="apk --$BUILD_TYPE"
          if [ "$SPLIT_ABI" = "true" ]; then
            BUILD_ARGS="$BUILD_ARGS --split-per-abi"
          fi

          # Inject API_BASE_URL if configured in inputs, vars, or secrets
          if [ -n "$API_BASE_URL" ]; then
            echo "Injecting API_BASE_URL: $API_BASE_URL"
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_BASE_URL=$API_BASE_URL"
          else
            echo "No custom API_BASE_URL provided; app will default to standard localhost / emulator endpoint."
          fi

          # Optional: inject additional dart defines if MOBILE_DART_DEFINES_JSON secret is set
          if [ -n "$DART_DEFINES_JSON" ]; then
            printf '%s' "$DART_DEFINES_JSON" > dart_defines.json
            BUILD_ARGS="$BUILD_ARGS --dart-define-from-file=dart_defines.json"
          fi

          echo "Executing: flutter build $BUILD_ARGS"
          flutter build $BUILD_ARGS

      # ------------------------------------------------------------------------
      # Upload Artifacts (Available for download in GitHub Actions UI)
      # ------------------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualis-mobile-${{ inputs.build_type || 'release' }}-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # ------------------------------------------------------------------------
      # Release Attachment (If triggered by a GitHub Release)
      # ------------------------------------------------------------------------
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Step Summary
      # ------------------------------------------------------------------------
      - name: APK Build Summary
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || secrets.API_BASE_URL }}
        run: |
          echo "### 📱 Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          if [ -n "$API_BASE_URL" ]; then
            echo "- **Configured API Base URL:** \`$API_BASE_URL\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Configured API Base URL:** \`Default (Local / Emulator)\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$apk" ]; then
              size=$(ls -lh "$apk" | awk '{print $5}')
              filename=$(basename "$apk")
              echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Artifact:** Downloadable from the GitHub Actions run summary under **Artifacts**." >> $GITHUB_STEP_SUMMARY
